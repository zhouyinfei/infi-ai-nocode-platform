# Include INSIDE the existing coze.ziyuanzz.online HTTPS server {} block.
# Put this include BEFORE generic regex locations for js/css/images.
# Reuses the site's port 443 and certificate; no public 8124 listener is needed.
# Covers are backend resources, even though their URLs end in .png.
# ^~ prevents generic image regex locations from serving them from the SPA root.
location ^~ /api/covers/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Preserve the full URI. /assets/ belongs to the workbench, not a published site.
location ~ "^/(?:preview/|site/|(?!assets(?:/|$))(?:[A-Za-z0-9]{6}|[a-f0-9]{32})(?:/|$))" {
    proxy_pass http://127.0.0.1:8125;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    # Keep the backend CSP sandbox header, including for new-window visits.
    add_header Content-Security-Policy "frame-ancestors https://coze.ziyuanzz.online" always;
}
